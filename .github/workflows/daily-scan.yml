name: Daily Michelin Scanner Workflow

on:
  schedule:
    # Executes automatically every day at 00:00 UTC (8:00 AM Singapore Time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Enables manual "Run workflow" button in Actions tab

permissions:
  contents: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install BeautifulSoup Library
        run: pip install beautifulsoup4

      - name: Run Michelin Web Scraper
        run: python scraper.py

      - name: Commit and Push Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add restaurants.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Michelin database" && git push)
