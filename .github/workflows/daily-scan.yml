name: Michelin Scraper Auto-Update

on:
  schedule:
    - cron: '0 0 * * *'  # Runs automatically every day at 00:00 UTC
  workflow_dispatch:      # Allows manual trigger via the Actions tab in GitHub

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run Michelin web scraper
        run: python scraper.py

      - name: Commit and push updated dataset
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add restaurants.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Michelin restaurants.json dataset" && git push)
