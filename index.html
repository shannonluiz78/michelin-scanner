    body { background-color: #080d1a; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); }
    .badge-3star { background: linear-gradient(135deg, #dc2626, #991b1b); }
    .badge-2star { background: linear-gradient(135deg, #e11d48, #be123c); }
    .badge-1star { background: linear-gradient(135deg, #b91c1c, #7f1d1d); }
    .badge-bib { background: linear-gradient(135deg, #ea580c, #c2410c); }
  </style>
</head>

        description: "Intimate 8-seat counter delivering masterclass sushi execution.",
        michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/shoukouwa",

        reviewsBreakdown: { 5: 72, 4: 20, 3: 5, 2: 2, 1: 1 }
      },

      // --- 1 MICHELIN STAR ---
      {
        id: "burnt-ends",
        name: "Burnt Ends",
        distinction: "1 Star",
        stars: 1,

        description: "Modern Australian barbecue centered around a custom dual-cavity brick kiln.",
        michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/burnt-ends",
        imageUrl: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80",
        reviewsBreakdown: { 5: 75, 4: 18, 3: 5, 2: 1, 1: 1 }
      },
      {
        id: "candlenut",
        name: "Candlenut",
        distinction: "1 Star",
        stars: 1,
        cuisine: "Peranakan",
        location: "Dempsey",

        priceMin: 98,
        priceMax: 168,
        signature: "Buah Keluak Wagyu Beef Rib & Curry Crab",
        rating: 4.5,

        summaryQuote: "The world's first Michelin-starred Peranakan restaurant.",
        description: "Chef Malcolm Lee elevates traditional Nyonya heritage recipes into refined dishes.",
        michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/candlenut",
        imageUrl: "https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=600&q=80",
        reviewsBreakdown: { 5: 68, 4: 22, 3: 7, 2: 2, 1: 1 }
      },
      {
        id: "tai-hwa",
        name: "Hill Street Tai Hwa Pork Noodle",
        distinction: "1 Star",
        stars: 1,
        cuisine: "Street Food",
        location: "Lavender",
        address: "466 Crawford Lane, #01-12",

        signature: "Bak Chor Mee (Minced Pork Noodle)",
        rating: 4.3,
        reviewCount: 2890,
        summaryQuote: "Legendary springy noodles tossed in spicy black vinegar and crispy lard.",
        description: "Historic Singaporean hawker stall holding a Michelin Star.",
        michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/hill-street-tai-hwa-pork-noodle",
        imageUrl: "https://images.unsplash.com/photo-1617093727343-374698b1b08d?auto=format&fit=crop&w=600&q=80",
        reviewsBreakdown: { 5: 60, 4: 25, 3: 10, 2: 3, 1: 2 }
      },

      // --- BIB GOURMAND ---
      {
        id: "tian-tian",
        name: "Tian Tian Hainanese Chicken Rice",
        distinction: "Bib Gourmand",
        stars: 0,
        cuisine: "Street Food",
        location: "Chinatown",
        address: "Maxwell Food Centre, #01-10",
        priceMin: 6,
        priceMax: 12,
        signature: "Hainanese Chicken Rice",
        rating: 4.4,
        reviewCount: 3410,
        summaryQuote: "Fragrant rice cooked in chicken broth paired with succulent poached chicken.",
        description: "Iconic Maxwell Food Centre stall awarded Michelin Bib Gourmand status.",
        michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/tian-tian-hainanese-chicken-rice",
        imageUrl: "https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=600&q=80",
        reviewsBreakdown: { 5: 70, 4: 20, 3: 6, 2: 3, 1: 1 }
      },
      {
        id: "kok-sen",
        name: "Kok Sen Restaurant",
        distinction: "Bib Gourmand",
        stars: 0,
        cuisine: "Zai Char",
        location: "Keong Saik",
        address: "2-4 Keong Saik Road",
        priceMin: 25,
        priceMax: 50,
        signature: "Big Prawn Bee Hoon Soup & Claypot Tofu",
        rating: 4.5,
        reviewCount: 1450,
        summaryQuote: "Traditional Cantonese zi char renowned for robust claypot dishes.",
        description: "Historic Keong Saik zi char eatery serving legendary prawn broths.",
        michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/kok-sen",
        imageUrl: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=600&q=80",
        reviewsBreakdown: { 5: 69, 4: 22, 3: 6, 2: 2, 1: 1 }
      },
      {
        id: "song-fa",
        name: "Song Fa Bak Kut Teh",
        distinction: "Bib Gourmand",
        stars: 0,
        cuisine: "Street Food",
        location: "Clarke Quay",
        address: "11 New Bridge Road",
        priceMin: 12,
        priceMax: 25,
        signature: "Pork Ribs Soup & Dough Fritters",
        rating: 4.5,
        reviewCount: 2980,
        summaryQuote: "Peppery Teochew-style pork rib soup refillable at your table.",
        description: "Multi-year Michelin Bib Gourmand awardee famous for aromatic broth.",
        michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/song-fa-bak-kut-teh-new-bridge-road",
        imageUrl: "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=600&q=80",
        reviewsBreakdown: { 5: 72, 4: 20, 3: 5, 2: 2, 1: 1 }
      }
    ];

    function App() {
      const [restaurants, setRestaurants] = useState(FALLBACK_RESTAURANTS);
      const [cuisine, setCuisine] = useState("Any");
      const [location, setLocation] = useState("Any");
      const [distinction, setDistinction] = useState("Any");
      const [maxPrice, setMaxPrice] = useState(600);
      const [sortBy, setSortBy] = useState("rating");
      const [selectedId, setSelectedId] = useState("odette");

      useEffect(() => {
        fetch("restaurants.json")
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data) && data.length > 0) {
              setRestaurants(data);
              setSelectedId(data[0].id);
            }
          })
          .catch(() => console.log("Loaded fallback dataset."));
      }, []);

      const cuisinesList = useMemo(() => ["Any", ...new Set(restaurants.map(r => r.cuisine))], [restaurants]);
      const locationsList = useMemo(() => ["Any", ...new Set(restaurants.map(r => r.location))], [restaurants]);

      const filtered = useMemo(() => {
        return restaurants.filter(r => {
          if (cuisine !== "Any" && r.cuisine !== cuisine) return false;
          if (location !== "Any" && r.location !== location) return false;
          if (distinction !== "Any" && r.distinction !== distinction) return false;
          if (r.priceMin > maxPrice) return false;
          return true;
        }).sort((a, b) => {
          if (sortBy === "rating") return b.rating - a.rating;
          if (sortBy === "priceAsc") return a.priceMin - b.priceMin;
          if (sortBy === "priceDesc") return b.priceMax - a.priceMax;
          if (sortBy === "stars") return (b.stars || 0) - (a.stars || 0);
          return 0;
        });
      }, [restaurants, cuisine, location, distinction, maxPrice, sortBy]);

      const selected = useMemo(() => {
        return restaurants.find(r => r.id === selectedId) || restaurants[0];
      }, [restaurants, selectedId]);

      const getBadgeClass = (dist) => {
        if (dist === "3 Stars") return "badge-3star";
        if (dist === "2 Stars") return "badge-2star";
        if (dist === "1 Star") return "badge-1star";
        return "badge-bib";
      };

      const getDistinctionLabel = (r) => {
        if (r.distinction === "3 Stars") return "3★ Stars";
        if (r.distinction === "2 Stars") return "2★ Stars";
        if (r.distinction === "1 Star") return "1★ Star";
        return "🏆 Bib Gourmand";
      };

      return (
        <div className="min-h-screen pb-12">
          <header className="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 border-b border-slate-800 p-6 md:p-8">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <div className="flex items-center gap-3">
                  <span className="bg-red-600 text-white font-black px-2.5 py-1 rounded text-xs uppercase tracking-widest">Singapore</span>
                  <p className="text-slate-400 text-sm">Official Michelin Guide Scanner</p>
                </div>
                <h1 className="text-2xl md:text-3xl font-extrabold text-white mt-1 tracking-tight">
                  MICHELIN RESTAURANT SCANNER
                </h1>
                <p className="text-slate-400 text-xs md:text-sm mt-1">
                  Accurate ratings, authentic images, and complete classification for 3-Stars, 2-Stars, 1-Star, and Bib Gourmand eateries.
                </p>
              </div>
              <div className="flex items-center gap-2 text-xs text-slate-300">
                <span className="bg-slate-800 px-3 py-2 rounded-lg border border-slate-700">🔍 {restaurants.length} Active Listings</span>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-8 flex flex-col gap-6">
              
              <div className="glass-card p-5 rounded-2xl shadow-xl">
                <h2 className="text-sm font-semibold text-slate-300 mb-4">SEARCH & FILTER RESTAURANTS</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Distinction Tier</label>
                    <select 
                      value={distinction} 
                      onChange={e => setDistinction(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-red-500"
                    >
                      <option value="Any">All Distinctions</option>
                      <option value="3 Stars">3 Michelin Stars</option>
                      <option value="2 Stars">2 Michelin Stars</option>
                      <option value="1 Star">1 Michelin Star</option>
                      <option value="Bib Gourmand">Bib Gourmand</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Cuisine</label>
                    <select 
                      value={cuisine} 
                      onChange={e => setCuisine(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-red-500"
                    >
                      {cuisinesList.map(c => <option key={c} value={c}>{c === "Any" ? "Any cuisine" : c}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Location</label>
                    <select 
                      value={location} 
                      onChange={e => setLocation(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-red-500"
                    >
                      {locationsList.map(l => <option key={l} value={l}>{l === "Any" ? "Any location" : l}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Max Price: SGD ${maxPrice}</label>
                    <input 
                      type="range" 
                      min="10" 
                      max="600" 
                      step="10" 
                      value={maxPrice} 
                      onChange={e => setMaxPrice(Number(e.target.value))}
                      className="w-full mt-3 accent-red-600"
                    />
                  </div>
                </div>
              </div>

              <div className="flex justify-between items-center">
                <div>
                  <h3 className="text-lg font-bold text-white">RESTAURANT LISTINGS</h3>
                  <p className="text-xs text-slate-400">Showing {filtered.length} of {restaurants.length} restaurants</p>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-xs text-slate-400">Sort:</span>
                  <select 
                    value={sortBy} 
                    onChange={e => setSortBy(e.target.value)}
                    className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white"
                  >
                    <option value="rating">Highest Rating</option>
                    <option value="stars">Most Stars / Distinction</option>
                    <option value="priceAsc">Price: Low to High</option>
                    <option value="priceDesc">Price: High to Low</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {filtered.map(r => (
                  <div 
                    key={r.id} 
                    onClick={() => setSelectedId(r.id)}
                    className={`glass-card rounded-2xl overflow-hidden cursor-pointer transition-all hover:border-red-500/50 hover:scale-[1.02] flex flex-col justify-between ${selectedId === r.id ? 'ring-2 ring-red-500' : ''}`}
                  >
                    <div>
                      <div className="relative h-40 overflow-hidden bg-slate-950">
                        <img 
                          src={r.imageUrl} 
                          alt={r.name} 
                          className="w-full h-full object-cover"
                          onError={(e) => { e.target.src = "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=600&q=80"; }}
                        />
                        <div className={`absolute top-3 left-3 ${getBadgeClass(r.distinction)} text-white px-2.5 py-1 rounded-full text-xs font-black shadow-md`}>
                          {getDistinctionLabel(r)}
                        </div>
                      </div>

                      <div className="p-4">
                        <h4 className="font-bold text-white text-base">{r.name}</h4>
                        <p className="text-xs text-slate-400 mb-2">{r.cuisine}</p>

                        <div className="space-y-1 text-xs text-slate-300">
                          <p>📍 {r.location}</p>
                          <p className="font-semibold text-amber-400">💰 SGD ${r.priceMin} – ${r.priceMax} per person</p>
                          <p className="truncate">🍴 {r.signature}</p>
                        </div>

                        <div className="flex items-center gap-2 mt-3 text-xs">
                          <span className="text-amber-400 font-bold">★ {r.rating}</span>
                          <span className="text-slate-500">({r.reviewCount} reviews)</span>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="lg:col-span-4">
              <div className="glass-card p-5 rounded-2xl sticky top-6 space-y-5">
                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 border-b border-slate-800 pb-2">
                  RESTAURANT PROFILE
                </h3>

                {selected && (
                  <>
                    <div>
                      <div className="relative h-48 rounded-xl overflow-hidden mb-3 bg-slate-950">
                        <img 
                          src={selected.imageUrl} 
                          alt={selected.name} 
                          className="w-full h-full object-cover" 
                          onError={(e) => { e.target.src = "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=600&q=80"; }}
                        />
                        <div className={`absolute top-3 left-3 ${getBadgeClass(selected.distinction)} text-white px-3 py-1 rounded-full text-xs font-black shadow-md`}>
                          {getDistinctionLabel(selected)}
                        </div>
                      </div>

                      <h2 className="text-xl font-extrabold text-white">{selected.name}</h2>
                      <p className="text-xs text-slate-400">{selected.cuisine} • {selected.distinction}</p>
                      <p className="text-xs text-slate-300 mt-1">📍 {selected.address || selected.location}</p>
                    </div>

                    <div className="grid grid-cols-2 gap-2 text-xs">
                      <div className="bg-slate-900/90 p-2.5 rounded-lg border border-slate-800">
                        <span className="text-slate-500 block">Rating</span>
                        <span className="text-amber-400 font-bold">★ {selected.rating}</span>
                        <span className="text-slate-500 text-[10px]"> ({selected.reviewCount})</span>
                      </div>
                      <div className="bg-slate-900/90 p-2.5 rounded-lg border border-slate-800">
                        <span className="text-slate-500 block">Est. Cost</span>
                        <span className="text-white font-bold">${selected.priceMin}–${selected.priceMax}</span>
                      </div>
                    </div>

                    <p className="text-xs text-slate-300 leading-relaxed">{selected.description}</p>

                    <a 
                      href={selected.michelinUrl} 
                      target="_blank" 
                      rel="noreferrer"
                      className="block w-full text-center bg-red-600 hover:bg-red-700 text-white font-medium text-xs py-2.5 rounded-lg transition"
                    >
                      View Michelin Page ↗
                    </a>
                  </>
                )}
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
