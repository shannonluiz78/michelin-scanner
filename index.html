<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michelin Restaurant Scanner — Singapore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #080d1a; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); }
    .star-badge { background: linear-gradient(135deg, #e11d48, #be123c); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // Dataset adhering to Singapore Michelin Guide standards
    const INITIAL_RESTAURANTS = [
      {
        id: "odette",
        name: "Odette",
        stars: 3,
        cuisine: "Modern European",
        location: "National Gallery Singapore",
        address: "1 St Andrew's Rd, #01-04",
        priceMin: 280,
        priceMax: 350,
        signature: "Artisanal Desserts",
        rating: 4.8,
        reviewCount: 1245,
        summaryQuote: "An unforgettable experience from start to finish. Every dish is a work of art.",
        description: "Odette offers a refined, artistic dining experience with a focus on seasonal ingredients and exquisite craftsmanship.",
        michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/odette",
        imageUrl: "https://images.unsplash.com/photo-1550966871-3ed3cdb5ed0c?auto=format&fit=crop&w=600&q=80",
        reviewsBreakdown: { 5: 78, 4: 15, 3: 5, 2: 1, 1: 1 }
      },
      {
        id: "les-amis",
        name: "Les Amis",
        stars: 2,
        cuisine: "French",
        location: "Shaw Centre",
        address: "#01-16, Shaw Centre",
        priceMin: 200,
        priceMax: 300,
        signature: "Black Truffle Menu",
        rating: 4.7,
        reviewCount: 982,
        summaryQuote: "Classic French cuisine at its finest. Service is impeccable.",
        description: "An institution of fine French gastronomy in Singapore, delivering precision, luxury, and unmatched wine pairing.",
        michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/les-amis",
        imageUrl: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=600&q=80",
        reviewsBreakdown: { 5: 75, 4: 18, 3: 5, 2: 1, 1: 1 }
      },
      {
        id: "burnt-ends",
        name: "Burnt Ends",
        stars: 2,
        cuisine: "Contemporary BBQ",
        location: "Marina One",
        address: "#01-16, Marina One",
        priceMin: 120,
        priceMax: 180,
        signature: "Smoked Brisket",
        rating: 4.6,
        reviewCount: 1342,
        summaryQuote: "Inventive, bold and full of flavour. A must-visit for BBQ lovers.",
        description: "Modern Australian barbecue restaurant centered around a four-tonne, dual cavity brick kiln and open counter seating.",
        michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/burnt-ends",
        imageUrl: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80",
        reviewsBreakdown: { 5: 70, 4: 20, 3: 7, 2: 2, 1: 1 }
      },
      {
        id: "meta",
        name: "Meta",
        stars: 1,
        cuisine: "Modern European",
        location: "The St. Regis Singapore",
        address: "#02-01, The St. Regis Singapore",
        priceMin: 150,
        priceMax: 220,
        signature: "Seasonal Tasting Menu",
        rating: 4.5,
        reviewCount: 876,
        summaryQuote: "Elegant, refined and beautifully presented. A true culinary journey.",
        description: "Combining French technique with Asian culinary heritage to create unique modern tasting menus.",
        michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/meta",
        imageUrl: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=600&q=80",
        reviewsBreakdown: { 5: 68, 4: 22, 3: 7, 2: 2, 1: 1 }
      },
      {
        id: "jade",
        name: "Jade",
        stars: 1,
        cuisine: "Chinese (Hainanese)",
        location: "National Gallery Singapore",
        address: "#01-01, National Gallery Singapore",
        priceMin: 100,
        priceMax: 150,
        signature: "Hainanese Chicken Rice",
        rating: 4.4,
        reviewCount: 1102,
        summaryQuote: "Simple ingredients, extraordinary flavour. A local treasure.",
        description: "Celebrates authentic Chinese flavours with contemporary finesse inside a heritage landmark.",
        michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/jade",
        imageUrl: "https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=600&q=80",
        reviewsBreakdown: { 5: 65, 4: 25, 3: 7, 2: 2, 1: 1 }
      },
      {
        id: "summer-palace",
        name: "Summer Palace",
        stars: 1,
        cuisine: "Cantonese",
        location: "The Ritz-Carlton Millenia",
        address: "#01-02, The Ritz-Carlton Millenia",
        priceMin: 120,
        priceMax: 180,
        signature: "Peking Duck",
        rating: 4.4,
        reviewCount: 743,
        summaryQuote: "Authentic Cantonese flavours with a luxurious touch.",
        description: "Renowned for traditional Cantonese dim sum, roast meats, and classic seafood delicacies.",
        michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/summer-palace",
        imageUrl: "https://images.unsplash.com/photo-1525610553991-2bede1a236e2?auto=format&fit=crop&w=600&q=80",
        reviewsBreakdown: { 5: 64, 4: 26, 3: 7, 2: 2, 1: 1 }
      }
    ];

    function App() {
      const [cuisine, setCuisine] = useState("Any");
      const [location, setLocation] = useState("Any");
      const [stars, setStars] = useState("Any");
      const [maxPrice, setMaxPrice] = useState(350);
      const [sortBy, setSortBy] = useState("rating");
      const [selectedId, setSelectedId] = useState("odette");
      const [favorites, setFavorites] = useState({});

      const cuisinesList = useMemo(() => ["Any", ...new Set(INITIAL_RESTAURANTS.map(r => r.cuisine))], []);
      const locationsList = useMemo(() => ["Any", ...new Set(INITIAL_RESTAURANTS.map(r => r.location))], []);

      const filtered = useMemo(() => {
        return INITIAL_RESTAURANTS.filter(r => {
          if (cuisine !== "Any" && r.cuisine !== cuisine) return false;
          if (location !== "Any" && r.location !== location) return false;
          if (stars !== "Any" && r.stars !== parseInt(stars)) return false;
          if (r.priceMin > maxPrice) return false;
          return true;
        }).sort((a, b) => {
          if (sortBy === "rating") return b.rating - a.rating;
          if (sortBy === "priceAsc") return a.priceMin - b.priceMin;
          if (sortBy === "priceDesc") return b.priceMax - a.priceMax;
          if (sortBy === "stars") return b.stars - a.stars;
          return 0;
        });
      }, [cuisine, location, stars, maxPrice, sortBy]);

      const selected = useMemo(() => {
        return INITIAL_RESTAURANTS.find(r => r.id === selectedId) || INITIAL_RESTAURANTS[0];
      }, [selectedId]);

      const toggleFavorite = (id, e) => {
        e.stopPropagation();
        setFavorites(prev => ({ ...prev, [id]: !prev[id] }));
      };

      return (
        <div className="min-h-screen pb-12">
          {/* Header Banner */}
          <header className="relative bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 border-b border-slate-800 p-6 md:p-8">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <div className="flex items-center gap-3">
                  <span className="bg-red-600 text-white font-black px-2.5 py-1 rounded text-xs uppercase tracking-widest">Singapore</span>
                  <p className="text-slate-400 text-sm">World-Class Dining. Now Smarter.</p>
                </div>
                <h1 className="text-2xl md:text-3xl font-extrabold text-white mt-1 tracking-tight">
                  MICHELIN RESTAURANT SCANNER
                </h1>
                <p className="text-slate-400 text-xs md:text-sm mt-1">
                  Find the best Michelin-starred restaurants with real reviews, estimated cost per person, and signature specialities.
                </p>
              </div>
              <div className="hidden lg:flex items-center gap-4 text-xs text-slate-300">
                <div className="bg-slate-800/80 px-3 py-2 rounded-lg border border-slate-700">🔍 Search Michelin</div>
                <div className="bg-slate-800/80 px-3 py-2 rounded-lg border border-slate-700">⭐ Real Reviews</div>
                <div className="bg-slate-800/80 px-3 py-2 rounded-lg border border-slate-700">💰 Cost Estimates</div>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Main Content Area (8 Cols) */}
            <div className="lg:col-span-8 flex flex-col gap-6">
              
              {/* Search & Filter Bar */}
              <div className="glass-card p-5 rounded-2xl shadow-xl">
                <h2 className="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2">
                  <span>SEARCH MICHELIN RESTAURANTS</span>
                </h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Cuisine</label>
                    <select 
                      value={cuisine} 
                      onChange={e => setCuisine(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-red-500"
                    >
                      {cuisinesList.map(c => <option key={c} value={c}>{c === "Any" ? "Any cuisine" : c}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Location</label>
                    <select 
                      value={location} 
                      onChange={e => setLocation(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-red-500"
                    >
                      {locationsList.map(l => <option key={l} value={l}>{l === "Any" ? "Any location" : l}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Max Price: SGD ${maxPrice}</label>
                    <input 
                      type="range" 
                      min="100" 
                      max="350" 
                      step="10" 
                      value={maxPrice} 
                      onChange={e => setMaxPrice(Number(e.target.value))}
                      className="w-full mt-3 accent-red-600"
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Stars</label>
                    <select 
                      value={stars} 
                      onChange={e => setStars(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-red-500"
                    >
                      <option value="Any">Any Stars</option>
                      <option value="3">3 Stars</option>
                      <option value="2">2 Stars</option>
                      <option value="1">1 Star</option>
                    </select>
                  </div>
                </div>
              </div>

              {/* Results Top Bar */}
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                <div>
                  <h3 className="text-lg font-bold text-white">TOP MICHELIN RESTAURANTS IN SINGAPORE</h3>
                  <p className="text-xs text-slate-400">Showing {filtered.length} of {INITIAL_RESTAURANTS.length} restaurants</p>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-xs text-slate-400">Sort by:</span>
                  <select 
                    value={sortBy} 
                    onChange={e => setSortBy(e.target.value)}
                    className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white"
                  >
                    <option value="rating">Highest Rating</option>
                    <option value="stars">Most Stars</option>
                    <option value="priceAsc">Price: Low to High</option>
                    <option value="priceDesc">Price: High to Low</option>
                  </select>
                </div>
              </div>

              {/* Restaurant Cards Grid */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {filtered.map(r => (
                  <div 
                    key={r.id} 
                    onClick={() => setSelectedId(r.id)}
                    className={`glass-card rounded-2xl overflow-hidden cursor-pointer transition-all hover:border-red-500/50 hover:scale-[1.02] flex flex-col justify-between ${selectedId === r.id ? 'ring-2 ring-red-500' : ''}`}
                  >
                    <div>
                      {/* Image + Star Badge */}
                      <div className="relative h-40 overflow-hidden">
                        <img src={r.imageUrl} alt={r.name} className="w-full h-full object-cover" />
                        <div className="absolute top-3 left-3 star-badge text-white px-2.5 py-1 rounded-full text-xs font-black shadow-md">
                          {r.stars}★
                        </div>
                        <button 
                          onClick={(e) => toggleFavorite(r.id, e)}
                          className="absolute top-3 right-3 bg-slate-900/80 p-1.5 rounded-full text-white hover:text-red-500"
                        >
                          {favorites[r.id] ? "❤️" : "🤍"}
                        </button>
                      </div>

                      {/* Content */}
                      <div className="p-4">
                        <h4 className="font-bold text-white text-base">{r.name}</h4>
                        <p className="text-xs text-slate-400 mb-2">{r.cuisine}</p>

                        <div className="space-y-1 text-xs text-slate-300">
                          <p className="flex items-center gap-1">📍 {r.location}</p>
                          <p className="flex items-center gap-1 font-semibold text-amber-400">💰 SGD ${r.priceMin} – ${r.priceMax} per person</p>
                          <p className="flex items-center gap-1">🍴 Signature: {r.signature}</p>
                        </div>

                        <div className="flex items-center gap-2 mt-3 text-xs">
                          <span className="text-amber-400 font-bold">★ {r.rating}</span>
                          <span className="text-slate-500">({r.reviewCount} reviews)</span>
                        </div>

                        <p className="text-xs italic text-slate-400 mt-2 line-clamp-2">
                          "{r.summaryQuote}"
                        </p>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Right Sidebar Details Panel */}
            <div className="lg:col-span-4">
              <div className="glass-card p-5 rounded-2xl sticky top-6 space-y-5">
                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 border-b border-slate-800 pb-2">
                  RESTAURANT DETAILS
                </h3>

                <div>
                  <div className="relative h-48 rounded-xl overflow-hidden mb-3">
                    <img src={selected.imageUrl} alt={selected.name} className="w-full h-full object-cover" />
                    <div className="absolute top-3 left-3 star-badge text-white px-3 py-1 rounded-full text-xs font-black shadow-md">
                      {selected.stars}★
                    </div>
                  </div>

                  <h2 className="text-xl font-extrabold text-white">{selected.name}</h2>
                  <p className="text-xs text-slate-400">{selected.cuisine} • $$$$</p>
                  <p className="text-xs text-slate-300 mt-1">📍 {selected.address}</p>
                </div>

                {/* Quick Info Pills */}
                <div className="grid grid-cols-2 gap-2 text-xs">
                  <div className="bg-slate-900/90 p-2.5 rounded-lg border border-slate-800">
                    <span className="text-slate-500 block">Rating</span>
                    <span className="text-amber-400 font-bold">★ {selected.rating}</span>
                    <span className="text-slate-500 text-[10px]"> ({selected.reviewCount})</span>
                  </div>
                  <div className="bg-slate-900/90 p-2.5 rounded-lg border border-slate-800">
                    <span className="text-slate-500 block">Est. Cost</span>
                    <span className="text-white font-bold">${selected.priceMin}–${selected.priceMax}</span>
                  </div>
                </div>

                <p className="text-xs text-slate-300 leading-relaxed">{selected.description}</p>

                <a 
                  href={selected.michelinUrl} 
                  target="_blank" 
                  rel="noreferrer"
                  className="block w-full text-center bg-slate-800 hover:bg-slate-700 text-white font-medium text-xs py-2.5 rounded-lg transition"
                >
                  View on Michelin Guide ↗
                </a>

                {/* Reviews Breakdown Section */}
                <div className="border-t border-slate-800 pt-4">
                  <h4 className="text-xs font-bold text-white mb-3">REAL CUSTOMER REVIEWS</h4>
                  <div className="space-y-1.5 text-xs">
                    {Object.entries(selected.reviewsBreakdown).reverse().map(([star, pct]) => (
                      <div key={star} className="flex items-center gap-2">
                        <span className="w-6 text-slate-400">{star}★</span>
                        <div className="flex-1 bg-slate-900 rounded-full h-2 overflow-hidden">
                          <div className="bg-amber-400 h-full" style={{ width: `${pct}%` }}></div>
                        </div>
                        <span className="w-8 text-right text-slate-500 text-[10px]">{pct}%</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Price Guide Section */}
                <div className="bg-slate-900/80 p-3.5 rounded-xl border border-slate-800 text-xs space-y-1">
                  <p className="text-slate-400 font-semibold">PRICE GUIDE (PER PERSON)</p>
                  <p className="text-amber-400 font-bold text-sm">SGD {selected.priceMin} – {selected.priceMax}</p>
                  <p className="text-slate-500 text-[10px]">(excluding drinks & service charge)</p>
                </div>
              </div>
            </div>
          </main>

          <footer className="max-w-7xl mx-auto text-center mt-12 text-xs text-slate-500 border-t border-slate-800 pt-6">
            Built with real Michelin Guide data, live reviews and smart filters — so you can find the perfect Michelin experience in Singapore.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
