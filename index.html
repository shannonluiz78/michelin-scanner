      { id: "summer-pavilion", name: "Summer Pavilion", distinction: "1 Star", stars: 1, cuisine: "Cantonese", location: "Marina Bay", address: "7 Raffles Ave, Ritz-Carlton Millenia", priceMin: 140, priceMax: 240, signature: "Poached Lobster Rice", rating: 4.7, reviewCount: 910, description: "Refined Cantonese fare served inside garden-inspired private pavilions.", michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/summer-pavilion", imageUrl: "https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=600&q=80" },
      { id: "sushi-kimura", name: "Sushi Kimura", distinction: "1 Star", stars: 1, cuisine: "Japanese (Sushi)", location: "Orchard", address: "390 Orchard Rd, Palais Renaissance", priceMin: 280, priceMax: 420, signature: "Organic Rice Edomae Sushi", rating: 4.7, reviewCount: 320, description: "Edomae sushi mastercraft featuring organic Tsugaru rice and Tsukiji fish.", michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/sushi-kimura", imageUrl: "https://images.unsplash.com/photo-1553621042-f6e147245754?auto=format&fit=crop&w=600&q=80" },
      { id: "sushi-sakuta", name: "Sushi Sakuta", distinction: "1 Star", stars: 1, cuisine: "Japanese (Sushi)", location: "Orchard", address: "15 Stamford Rd, Capitol Singapore", priceMin: 350, priceMax: 500, signature: "Seasonal Japanese Fish Omakase", rating: 4.8, reviewCount: 290, description: "Precision omakase utilizing custom vinegar blends and pristine catches.", michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/sushi-sakuta", imageUrl: "https://images.unsplash.com/photo-1579584425555-c3ce17fd4351?auto=format&fit=crop&w=600&q=80" },
      { id: "waku-ghin", name: "Waku Ghin", distinction: "1 Star", stars: 1, cuisine: "Japanese Contemporary", location: "Marina Bay", address: "Level 2 Dining, Marina Bay Sands", priceMin: 250, priceMax: 480, signature: "Botan Shrimp with Sea Urchin & Caviar", rating: 4.7, reviewCount: 580, description: "Chef Tetsuya Wakuda's teppan counters showcasing Japanese seafood and Wagyu.", michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/waku-ghin", imageUrl: "https://images.unsplash.com/photo-1514933651103-005eec06c04b?auto=format&fit=crop&w=600&q=80" },
      { id: "whitegrass", name: "Whitegrass", distinction: "1 Star", stars: 1, cuisine: "French-Japanese", location: "City Hall", address: "30 Victoria St, #01-26 CHIJMES", priceMin: 148, priceMax: 248, signature: "Japanese Murata Beef Omakase", rating: 4.6, reviewCount: 420, description: "Classic French sauces paired delicately with Japanese seasonal produce.", michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/whitegrass", imageUrl: "https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&w=600&q=80" },
      { id: "willow", name: "Willow", distinction: "1 Star", stars: 1, cuisine: "Asian Contemporary", location: "City Hall", address: "39 HongKong Street", priceMin: 158, priceMax: 248, signature: "Amadai Scale-Crusted Fish", rating: 4.7, reviewCount: 390, description: "Refined counter dining focusing on sustainable, seasonal Asian seafood.", michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/willow", imageUrl: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=600&q=80" },
      { id: "yong-fu", name: "Yong Fu", distinction: "1 Star", stars: 1, cuisine: "Chinese (Ningbo)", location: "City Hall", address: "3 Temasek Blvd, Suntec City", priceMin: 168, priceMax: 298, signature: "Ningbo 18 Cuts Raw Marinated Crab", rating: 4.6, reviewCount: 310, description: "Ningbo seafood specialty dining featuring wild catches straight from Zhejiang.", michelinUrl: "https://guide.michelin.com/sg/en/singapore-region/singapore/restaurant/yong-fu", imageUrl: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=600&q=80" }
    ];

    function App() {
      const [restaurants, setRestaurants] = useState(FULL_45_MICHELIN_LIST);
      const [cuisine, setCuisine] = useState("Any");
      const [location, setLocation] = useState("Any");
      const [distinction, setDistinction] = useState("Any");
      const [maxPrice, setMaxPrice] = useState(600);
      const [sortBy, setSortBy] = useState("rating");
      const [selectedId, setSelectedId] = useState("les-amis");

      useEffect(() => {
        fetch("restaurants.json")
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data) && data.length >= 40) {
              setRestaurants(data);
            }
          })
          .catch(() => console.log("Loaded fallback 45-item dataset."));
      }, []);

      const cuisinesList = useMemo(() => ["Any", ...new Set(restaurants.map(r => r.cuisine))], [restaurants]);
      const locationsList = useMemo(() => ["Any", ...new Set(restaurants.map(r => r.location))], [restaurants]);

      const filtered = useMemo(() => {
        return restaurants.filter(r => {
          if (cuisine !== "Any" && r.cuisine !== cuisine) return false;
          if (location !== "Any" && r.location !== location) return false;
          if (distinction !== "Any" && r.distinction !== distinction) return false;
          if (r.priceMin > maxPrice) return false;
          return true;
        }).sort((a, b) => {
          if (sortBy === "rating") return b.rating - a.rating;
          if (sortBy === "priceAsc") return a.priceMin - b.priceMin;
          if (sortBy === "priceDesc") return b.priceMax - a.priceMax;
          if (sortBy === "stars") return (b.stars || 0) - (a.stars || 0);
          return 0;
        });
      }, [restaurants, cuisine, location, distinction, maxPrice, sortBy]);

      const selected = useMemo(() => {
        return restaurants.find(r => r.id === selectedId) || restaurants[0];
      }, [restaurants, selectedId]);

      const getBadgeClass = (dist) => {
        if (dist === "3 Stars") return "badge-3star";
        if (dist === "2 Stars") return "badge-2star";
        return "badge-1star";
      };

      const getDistinctionLabel = (r) => {
        if (r.distinction === "3 Stars") return "3★ Stars";
        if (r.distinction === "2 Stars") return "2★ Stars";
        return "1★ Star";
      };

      return (
        <div className="min-h-screen pb-12">
          <header className="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 border-b border-slate-800 p-6 md:p-8">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <div className="flex items-center gap-3">
                  <span className="bg-red-600 text-white font-black px-2.5 py-1 rounded text-xs uppercase tracking-widest">Singapore</span>
                  <p className="text-slate-400 text-sm">Official Michelin Guide Scanner</p>
                </div>
                <h1 className="text-2xl md:text-3xl font-extrabold text-white mt-1 tracking-tight">
                  MICHELIN RESTAURANT SCANNER
                </h1>
                <p className="text-slate-400 text-xs md:text-sm mt-1">
                  Complete catalog of all 45 Michelin-starred dining experiences in Singapore.
                </p>
              </div>
              <div className="flex items-center gap-2 text-xs text-slate-300">
                <span className="bg-slate-800 px-3 py-2 rounded-lg border border-slate-700 font-bold text-amber-400">🔍 {restaurants.length} Total Restaurants Loaded</span>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-8 flex flex-col gap-6">
              <div className="glass-card p-5 rounded-2xl shadow-xl">
                <h2 className="text-sm font-semibold text-slate-300 mb-4">SEARCH & FILTER RESTAURANTS</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Distinction Tier</label>
                    <select value={distinction} onChange={e => setDistinction(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                      <option value="Any">All Distinctions</option>
                      <option value="3 Stars">3 Michelin Stars</option>
                      <option value="2 Stars">2 Michelin Stars</option>
                      <option value="1 Star">1 Michelin Star</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Cuisine</label>
                    <select value={cuisine} onChange={e => setCuisine(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                      {cuisinesList.map(c => <option key={c} value={c}>{c === "Any" ? "Any cuisine" : c}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Location</label>
                    <select value={location} onChange={e => setLocation(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                      {locationsList.map(l => <option key={l} value={l}>{l === "Any" ? "Any location" : l}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Max Price: SGD ${maxPrice}</label>
                    <input type="range" min="10" max="600" step="10" value={maxPrice} onChange={e => setMaxPrice(Number(e.target.value))} className="w-full mt-3 accent-red-600" />
                  </div>
                </div>
              </div>

              <div className="flex justify-between items-center">
                <div>
                  <h3 className="text-lg font-bold text-white">RESTAURANT LISTINGS</h3>
                  <p className="text-xs text-slate-400">Showing {filtered.length} of {restaurants.length} restaurants</p>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-xs text-slate-400">Sort:</span>
                  <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white">
                    <option value="rating">Highest Rating</option>
                    <option value="stars">Most Stars / Distinction</option>
                    <option value="priceAsc">Price: Low to High</option>
                    <option value="priceDesc">Price: High to Low</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {filtered.map(r => (
                  <div key={r.id} onClick={() => setSelectedId(r.id)} className={`glass-card rounded-2xl overflow-hidden cursor-pointer transition-all hover:border-red-500/50 hover:scale-[1.02] flex flex-col justify-between ${selectedId === r.id ? 'ring-2 ring-red-500' : ''}`}>
                    <div>
                      <div className="relative h-40 overflow-hidden bg-slate-950">
                        <img src={r.imageUrl} alt={r.name} className="w-full h-full object-cover" onError={(e) => { e.target.src = "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=600&q=80"; }} />
                        <div className={`absolute top-3 left-3 ${getBadgeClass(r.distinction)} text-white px-2.5 py-1 rounded-full text-xs font-black shadow-md`}>
                          {getDistinctionLabel(r)}
                        </div>
                      </div>
                      <div className="p-4">
                        <h4 className="font-bold text-white text-base">{r.name}</h4>
                        <p className="text-xs text-slate-400 mb-2">{r.cuisine}</p>
                        <div className="space-y-1 text-xs text-slate-300">
                          <p>📍 {r.location}</p>
                          <p className="font-semibold text-amber-400">💰 SGD ${r.priceMin} – ${r.priceMax} per person</p>
                          <p className="truncate">🍴 {r.signature}</p>
                        </div>
                        <div className="flex items-center gap-2 mt-3 text-xs">
                          <span className="text-amber-400 font-bold">★ {r.rating}</span>
                          <span className="text-slate-500">({r.reviewCount} reviews)</span>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="lg:col-span-4">
              <div className="glass-card p-5 rounded-2xl sticky top-6 space-y-5">
                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 border-b border-slate-800 pb-2">RESTAURANT PROFILE</h3>
                {selected && (
                  <>
                    <div>
                      <div className="relative h-48 rounded-xl overflow-hidden mb-3 bg-slate-950">
                        <img src={selected.imageUrl} alt={selected.name} className="w-full h-full object-cover" onError={(e) => { e.target.src = "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=600&q=80"; }} />
                        <div className={`absolute top-3 left-3 ${getBadgeClass(selected.distinction)} text-white px-3 py-1 rounded-full text-xs font-black shadow-md`}>
                          {getDistinctionLabel(selected)}
                        </div>
                      </div>
                      <h2 className="text-xl font-extrabold text-white">{selected.name}</h2>
                      <p className="text-xs text-slate-400">{selected.cuisine} • {selected.distinction}</p>
                      <p className="text-xs text-slate-300 mt-1">📍 {selected.address || selected.location}</p>
                    </div>
                    <div className="grid grid-cols-2 gap-2 text-xs">
                      <div className="bg-slate-900/90 p-2.5 rounded-lg border border-slate-800">
                        <span className="text-slate-500 block">Rating</span>
                        <span className="text-amber-400 font-bold">★ {selected.rating}</span>
                        <span className="text-slate-500 text-[10px]"> ({selected.reviewCount})</span>
                      </div>
                      <div className="bg-slate-900/90 p-2.5 rounded-lg border border-slate-800">
                        <span className="text-slate-500 block">Est. Cost</span>
                        <span className="text-white font-bold">${selected.priceMin}–${selected.priceMax}</span>
                      </div>
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed">{selected.description}</p>
                    <a href={selected.michelinUrl} target="_blank" rel="noreferrer" className="block w-full text-center bg-red-600 hover:bg-red-700 text-white font-medium text-xs py-2.5 rounded-lg transition">View Michelin Page ↗</a>
                  </>
                )}
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
